[package]
name = "jamuphp"
version = "0.0.1"
edition = "2024"
description = "Supervisor yang menyalakan Caddy dan PHP dari hasil deteksi project"
publish = false

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[bin]]
name = "jamu"
path = "src/main.rs"
