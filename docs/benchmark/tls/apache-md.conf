MDCertificateAuthority https://ca.test/acme/local/directory
MDCertificateAgreement accepted
MDCACertificateFile /ca/root.crt
MDContactEmail admin@situs-a.test
MDPrivateKeys secp256r1
MDMessageCmd /hook.sh
MDomain situs-a.test
Protocols h2 http/1.1 acme-tls/1
<VirtualHost *:80>
  ServerName situs-a.test
  DocumentRoot /app
</VirtualHost>
<VirtualHost *:443>
  ServerName situs-a.test
  SSLEngine on
  DocumentRoot /app
</VirtualHost>
<Directory /app>
  Require all granted
</Directory>
ErrorLog /proc/self/fd/2
LogLevel md:info
