<VirtualHost *:80>
  DocumentRoot /app
  <Directory /app>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
    <FilesMatch "\.php$">
      SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>
  </Directory>
  ErrorLog /proc/self/fd/2
</VirtualHost>
