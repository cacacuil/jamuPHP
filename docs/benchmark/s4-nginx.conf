# nginx pembanding untuk S4. Ia berdiri di depan php-fpm milik container jamu (soket yang
# sama), jadi selisih angkanya hanya berasal dari lapisan web. @SOCK@ diganti s4.sh.
#   port 8080: semua halaman lewat PHP, seperti jamu sekarang
#   port 8081: berkas supercache disajikan nginx langsung (aturan baku WP Super Cache)
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  sendfile on;
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  # Halaman uji 126 KB; tanpa ini nginx menulis jawaban PHP ke berkas sementara.
  fastcgi_buffer_size 16k;
  fastcgi_buffers 32 8k;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /app;
    index index.php;
    location / { try_files $uri $uri/ /index.php?$args; }
    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass unix:@SOCK@;
    }
  }

  server {
    listen 8081;
    root /app;
    index index.php;
    set $cache_uri $request_uri;
    if ($request_method = POST) { set $cache_uri 'null cache'; }
    if ($query_string != "") { set $cache_uri 'null cache'; }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_logged_in") { set $cache_uri 'null cache'; }
    location / {
      try_files /wp-content/cache/supercache/$host/$cache_uri/index.html $uri $uri/ /index.php?$args;
    }
    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass unix:@SOCK@;
    }
  }
}
