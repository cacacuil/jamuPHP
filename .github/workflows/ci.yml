name: ci
on: push

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jamuphp:8.4 .
      - run: tests/image.sh jamuphp:8.4
      # Hanya image yang lulus uji asap yang diterbitkan.
      # main -> ghcr.io/<pemilik>/jamuphp:8.4, branch spike/x -> :spike-x
      - name: Terbitkan ke GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/spike/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=8.4
          [ "$GITHUB_REF_NAME" = main ] || tag=${GITHUB_REF_NAME//\//-}
          target=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jamuphp:$tag
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag jamuphp:8.4 "$target"
          docker push "$target"

  # jamu + Caddy + php-fpm dari paket distro: jalur yang dipakai developer di Linux.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - name: Pasang php-fpm dan Caddy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q php8.3-fpm php8.3-cli php8.3-sqlite3 php8.3-mbstring php8.3-xml php8.3-curl php8.3-zip msmtp
          mkdir -p unduh bin
          gh release download --repo caddyserver/caddy --pattern '*_linux_amd64.tar.gz' --dir unduh
          tar -xzf unduh/caddy_*_linux_amd64.tar.gz -C bin caddy
          bin/caddy version
          php -v
      - name: Siapkan Laravel dan WordPress
        run: bash tests/sites.sh sites
      - name: Uji end-to-end
        run: JAMU_CADDY="$PWD/bin/caddy" LARAVEL_DIR="$PWD/sites/laravel" WP_DIR="$PWD/sites/wp" bash tests/e2e.sh

  # jamu + Caddy + php-cgi dari zip resmi PHP, di Windows asli.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    defaults:
      run:
        shell: bash
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Rakit jamu, Caddy, PHP, dan Composer dalam satu folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/php unduh
          cp target/release/jamu.exe dist/
          gh release download --repo caddyserver/caddy --pattern '*_windows_amd64.zip' --dir unduh
          unzip -q -o unduh/caddy_*_windows_amd64.zip caddy.exe -d dist
          zip=php-$PHP_VERSION-nts-Win32-vs17-x64-latest.zip
          curl -fsSL -o unduh/php.zip "https://downloads.php.net/~windows/releases/latest/$zip" \
            || curl -fsSL -o unduh/php.zip "https://windows.php.net/downloads/releases/latest/$zip"
          unzip -q unduh/php.zip -d dist/php
          curl -fsSL -o dist/composer.phar https://getcomposer.org/download/latest-stable/composer.phar
          dist/caddy.exe version
          dist/php/php-cgi.exe -v
          ls dist/php | head -40
      - name: Siapkan Laravel dan WordPress
        run: JAMU=dist/jamu.exe bash tests/sites.sh sites
      - name: Uji end-to-end (sama dengan Linux)
        run: |
          root=$(cygpath -m "$PWD")
          JAMU=dist/jamu.exe LARAVEL_DIR="$root/sites/laravel" WP_DIR="$root/sites/wp" bash tests/e2e.sh
      - name: Uji khusus Windows
        if: always()
        run: JAMU=dist/jamu.exe PHP_DIR=dist/php bash tests/windows.sh
      - name: Berhenti dengan rapi (Ctrl-Break)
        if: always()
        run: python tests/windows_stop.py dist/jamu.exe
      - name: Simpan rakitan untuk dicoba di Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jamuphp-windows-php${{ matrix.php }}
          path: dist
